x-logging: &default-logging
  # 限制容器日志体积，避免长期运行后日志把服务器磁盘写满
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_rag}
      MYSQL_USER: ${MYSQL_USER:-edu_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30

  etcd:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.18}
    restart: unless-stopped
    logging: *default-logging
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 30

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30

  milvus:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.15}
    restart: unless-stopped
    logging: *default-logging
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      # 只绑本机：api 与 attu 都通过 compose 内网访问 milvus:19530，
      # 公网暴露 19530 会让 Milvus 直接对互联网开放（阿里云安全组若放行则风险极高）。
      # 需要从宿主机调试时用 SSH 隧道即可。
      - "127.0.0.1:19530:19530"
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 20

  attu:
    image: ${ATTU_IMAGE:-zilliz/attu:v2.5.12}
    profiles: ["admin-tools"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      milvus: { condition: service_healthy }

  mineru:
    build:
      context: .
      dockerfile: docker/mineru.Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MINERU_MODEL_SOURCE: modelscope
      MINERU_API_MAX_CONCURRENT_REQUESTS: ${MINERU_API_MAX_CONCURRENT_REQUESTS:-1}
      MINERU_API_OUTPUT_ROOT: /data/output
    volumes:
      - mineru_cache:/root/.cache
      - mineru_output:/data/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 20

  api:
    build:
      context: .
      target: api
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    logging: *default-logging
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-edu_rag}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-edu_rag}?charset=utf8mb4"
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MILVUS_URI: http://milvus:19530
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-edu_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-edu_rag}
    volumes:
      - ${MODEL_HOST_PATH:-./models}:/app/models:ro
      - ./logs:/app/logs
      - ./reports:/app/reports
    depends_on:
      mysql: { condition: service_healthy }
      milvus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10

  web:
    build:
      context: .
      target: web
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 生产环境默认只监听宿主机回环地址，由宿主机 Nginx/HTTPS 统一对外服务。
      - "${WEB_BIND:-127.0.0.1:8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  mineru_cache:
  mineru_output:

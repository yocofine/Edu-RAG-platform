log_format app_sanitized '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;
    access_log /var/log/nginx/access.log app_sanitized;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    # PDF/图片预览必须把 Range 原样传给 FastAPI，并立即把 206 分段响应转发给浏览器。
    # 关闭响应缓冲可避免大文件被 Nginx 写入临时文件后再发送。
    location ~ ^/api/v1/documents/[^/]+/preview$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";
        proxy_force_ranges on;
        proxy_pass_header X-Accel-Buffering;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1800s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # replica/ 下的 legacy-*.js 是固定路径（不带 hash），浏览器会长期缓存旧版本，
    # 导致"源码改了、镜像也重建了，页面却还是旧行为"。这里要求每次回源校验。
    location /replica/ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

